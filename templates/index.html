<!DOCTYPE html>
<html>
<head>
    <title>5S & KAIZEN Audit Form</title>
</head>
<body>
    <h1>5S & KAIZEN AUDIT FORM</h1>
    <form action="{{ url_for('submit') }}" method="POST" enctype="multipart/form-data">

        <!-- Text-only fields -->
        {% for field in ['Department', 'Date', 'Email'] %}
            <label>{{ field }}:</label><br>
            <input type="text" name="{{ field.lower() }}" required><br><br>
        {% endfor %}

        <!-- Main audit questions -->
        {% for q in questions %}
            <h3>{{ loop.index }}. {{ q }}</h3>

            <label>Comment:</label><br>
            <input type="text" name="answer_{{ loop.index0 }}" required><br><br>

            <label>Rating:</label><br>
            <select name="rating_{{ loop.index0 }}" required>
                <option value="">-- Select Rating --</option>
                {% for r in range(1, rating_ranges[loop.index0] + 1) %}
                    <option value="{{ r }}">{{ r }}</option>
                {% endfor %}
            </select><br><br>

            <label>Upload Images (Max 10):</label>
            <input type="file" name="image_{{ loop.index0 }}" multiple><br><br>
            <hr>
        {% endfor %}

        <button type="submit">Submit</button>
    </form>
</body>
</html>
