<!DOCTYPE html>
<html>
<head>
    <title>5S & KAIZEN Audit Form</title>
</head>
<body>
    <h1>5S & KAIZEN AUDIT FORM</h1>
    <form action="{{ url_for('submit') }}" method="POST" enctype="multipart/form-data">

        <!-- Text-only fields -->
        {% for field in ['Department', 'Date', 'Email'] %}
            <label>{{ field }}:</label><br>
            <input type="text" name="{{ field.lower() }}"><br><br>
        {% endfor %}

        <!-- Main audit questions -->
        {% for q in questions %}
        <h3>{{ loop.index }}. {{ q }}</h3>
    
        <label>Rating:</label><br>
        <select name="rating_{{ loop.index0 }}">
            <option value="">-- Select Rating --</option>
            {% for r in range(1, rating_ranges[loop.index0] + 1) %}
                <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
        </select><br><br>
    
        <label>Upload Images or Take Photo:</label><br>
        <input 
            type="file" 
            name="image_{{ loop.index0 }}" 
            accept="image/*" 
            capture="environment" 
            multiple><br><br>
    
        <label>Select Image Tag:</label><br>
        <select name="image_tag_{{ loop.index0 }}">
            <option value="">-- Select Tag --</option>
            <option value="Before">Before</option>
            <option value="After">After</option>
            <option value="Issue">Issue</option>
            <option value="Other">Other</option>
        </select><br><br>
    
        <hr>
    {% endfor %}    

        <button type="submit">NEXT</button>
    </form>
</body>
</html>
