<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5S Audit Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 40px;
            margin-bottom: 40px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
        }
        .submit-btn {
            font-size: 1.2rem;
            padding: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">-----5S AUDIT FORM------ </h2>
    <form method="POST" action="/submit" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <input type="text" class="form-control" name="department" value="{{ session.get('department', '') }}">
        </div>
        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" name="date" value="{{ session.get('date', '') }}">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ session.get('email', '') }}">
        </div>

        {% for question in questions %}
        {% set i = loop.index0 %}
        <div class="form-section">
            <div class="mb-3">
                <label for="answer_{{ i }}" class="form-label"><strong>Q{{ i+1 }}. {{ question }}</strong></label>
                <!-- <input type="text" class="form-control" name="answer_{{ i }}" value="{{ answers[i] }}"> -->
            </div>
            <div class="mb-3">
                <label for="rating_{{ i }}" class="form-label">Rating (1 to {{ rating_ranges[i] }})</label>
                <select class="form-select" name="rating_{{ i }}">
                    <option value="">Select</option>
                    {% for r in range(1, rating_ranges[i] + 1) %}
                        <option value="{{ r }}" {% if ratings[i] == r|string %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="image_{{ i }}" class="form-label">Upload Images</label>
                <input class="form-control" type="file" id="image_{{ i }}" name="image_{{ i }}" multiple>
            </div>
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary submit-btn w-100"> PERVIEW </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
